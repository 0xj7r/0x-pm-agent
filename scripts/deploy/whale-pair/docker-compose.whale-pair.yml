# Docker Compose for the Dublin whale-pair live bot.
# This file is intentionally separate from the repo-root docker-compose.yml,
# which is owned by the Hetzner/Falkenstein stack.
#
# Usage (on Dublin host):
#   docker compose -f docker-compose.whale-pair.yml up -d --build
#
# Flags are set through WHALE_PAIR_EXTRA_ARGS (defaults to dry-run).

services:
  whale-pair-live:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: polymarket-agent-whale-pair:latest
    container_name: polymarket-whale-pair-live
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      POLYMARKET_SIGNATURE_TYPE: "1"
      ALLOW_LIVE_WITHOUT_SUPABASE: "${ALLOW_LIVE_WITHOUT_SUPABASE:-1}"
    volumes:
      - ../../../data:/data
    entrypoint: ["python", "-u", "scripts/whale_pair_live_bot.py"]
    command:
      - "--db"
      - "/data/whale_pair_live.db"
      - "--loop"
      - "${WHALE_PAIR_LOOP_SECONDS:-15}"
      - "--base-clip-usd"
      - "${WHALE_PAIR_BASE_CLIP_USD:-10.0}"
      - "--aggressive-clip-usd"
      - "${WHALE_PAIR_AGGRESSIVE_CLIP_USD:-50.0}"
      - "--max-gross-cost-usd"
      - "${WHALE_PAIR_MAX_GROSS_COST_USD:-200.0}"
      - "--ws-max-age-ms"
      - "${WHALE_PAIR_WS_MAX_AGE_MS:-2000}"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
