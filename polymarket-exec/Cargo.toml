[package]
name = "polymarket-exec"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
alloy = { version = "1.6.3", default-features = false, features = [
    "signer-local",
    "providers",
    "provider-http",
    "network",
    "consensus",
    "rpc-types-eth",
] }
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prometheus = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
polymarket-client-sdk = { version = "0.4.4", features = ["clob", "data", "heartbeats"] }
polymarket_client_sdk_v2 = { version = "0.5.1", features = ["clob", "data", "heartbeats", "tracing"] }
chrono = "0.4.44"
