# ================================================
# Polymarket BTC 5-Min Pair-Cost Hedged Arbitrage
# Gabagool-Style Strategy Configuration
# Version: 1.0 (May 2026)
# ================================================

strategy: pair_cost_arb

# ── Core Pair-Cost Guardrail (the heart of the strategy) ─────────────────────
pair_cost:
  threshold: 0.99                    # Buy only if projected pair_cost stays below this
  high_vol_threshold: 0.97           # Tighter threshold in high-vol / whipsaw regimes
  min_merge_usd: 50.0                # Minimum balanced pair size before auto-merging
  min_edge_bps: 100                  # Minimum edge required to buy a cheap leg

# ── Clip Sizing (fractional Kelly) ───────────────────────────────────────────
clip_sizing:
  base_clip_usd: 1.5
  min_clip_usd: 0.5
  max_clip_usd: 4.0
  fractional_kelly: 0.15
  capital_scale_factor: 0.5          # 0.5 = tiny-live ($50), 1.0 = full live

# ── Convexity & Late-Window Amplification (source of asymmetric wins) ────────
convexity:
  late_window_sec: 120               # Seconds remaining to start allowing excess
  convex_p_threshold: 0.70           # P(Up) or P(Down) > 70% → stop buying opposite leg
  max_excess_usd: 8.0                # Hard cap on asymmetric exposure
  avoid_rehedging_when_convex: true  # Do not buy opposite leg once high-conviction excess exists
  allow_extra_clip_on_winner: true   # Permit one more winner-side cheap-leg clip when signal allows

# ── Signals (the "brain" — cheap-leg detection) ─────────────────────────────
signals:
  fair_value:
    momentum_weight: 0.65
    vol_lookback_sec: 60
    use_piecewise_approx: true

  cheap_leg:
    price_deviation_bps: 35          # How far below fair value to consider "cheap"
    order_flow_imbalance_threshold: 0.0

  vol_regime:
    high_vol_atr_threshold: 0.00085
    extreme_vol_pause: true          # Pause new buys in extreme volatility

# ── Optional Hybrid Light MM Overlay (for liquidity rewards) ────────────────
hybrid_mm:
  enabled: true
  capital_pct: 0.15                  # % of capital used for two-sided ladders
  base_spread_bps: 80

# ── Rescue / EV Hold Logic ───────────────────────────────────────────────────
rescue:
  hedge_rescue_edge_bps: 25
  max_gross_cost_usd: 12
  max_gross_cost_bps: 300

# ── Operational & Safety Settings ────────────────────────────────────────────
operational:
  cooldown_ms: 100
  asymmetric_fill_max_penalty: 0.02
  max_exposure_usd: 12
  max_session_loss_bps: 2500
  enable_buy_light_side_rebalance: true
  recycle_min_imbalance_qty: 5.0
  recycle_min_time_remaining_ms: 90000
  recycle_max_light_side_spread: 0.10

# ── Metadata ─────────────────────────────────────────────────────────────────
version: "1.0"
last_updated: "2026-05-01"
description: "Gabagool-style pair-cost arbitrage with convexity overlay for BTC 5m markets"
