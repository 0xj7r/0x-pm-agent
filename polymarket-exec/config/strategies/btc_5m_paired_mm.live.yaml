# ================================================
# Polymarket BTC 5-Min Paired Market Making
# Two-sided paired-bid / merge-recycle strategy profile
# Version: 1.0 (May 2026)
# ================================================

strategy: paired_mm

# ── Quote & Ladder Controls ─────────────────────────────────────
quote:
  levels_per_side: 12
  base_clip_usd: 1.50
  min_clip_usd: 0.50
  max_clip_usd: 5.0
  min_edge_bps: 75
  inventory_skew_bps: 150
  max_spread: 0.08
  min_top_depth_notional_usd: 3.0
  min_order_notional_usd: 0.50
  entry_ladder_levels: 12
  entry_ladder_spacing_ticks: 1.0
  maker_safety_ticks: 2.0
  venue_min_order_quantity: 5.0
  entry_min_size_multiplier: 1.00

# ── Fair-Value Anchoring ────────────────────────────────────────
# Paired-MM is liquidity provision, not directional taking. The physical
# fair-value model can pull quotes, but only within a bounded distance from
# live book mid.
fair_value:
  max_model_divergence: 0.10
  model_influence_weight: 0.30

# ── Inventory & Risk Limits ─────────────────────────────────────
inventory:
  # Inventory knobs are intentionally looser than legacy values to avoid
  # artificial stranding pressure in fast close-out windows while retaining hard
  # safety rails for 5m sleeves.
  max_gross_notional_usd: 75.0
  max_net_notional_per_market_usd: 35.0
  max_order_notional_usd: 8.0
  max_position_quantity_per_instrument: 150.0
  min_free_cash_usd: 5.0
  min_free_cash_bps: 1000.0
  max_session_loss_bps: 2500.0
  max_open_orders_total: 40
  max_open_orders_per_market: 24
  max_stranded_leg_usd: 28.0
  max_gross_cost_usd: 75.0
  max_leg_cost_usd: 32.0
  max_side_imbalance_qty: 45.0

# ── Convexity Overlay ───────────────────────────────────────────
# Late-window Bonereaper-style package: buy both sides, load more notional
# into the model-favoured leg, and accumulate many cheap-tail shares when
# the opposite leg collapses. EV is logged but not a hard gate because the
# short-horizon model is weakest exactly where the convex payoff is largest.
convexity_overlay:
  enabled: true
  suppress_ladder_when_package_fires: true
  start_frac: 0.60
  capital_pct: 0.10
  fractional_kelly: 0.15
  max_loss_usd: 40.0
  max_book_take_pct: 0.20
  min_order_usd: 0.25
  max_active_orders_per_leg: 3
  late_window_sec: 120
  convex_p_threshold: 0.72
  maker_safety_ticks: 2.0
  min_favorite_edge_bps: 25
  tail_enabled: true
  max_favorite_win_loss_usd: 10.00
  min_tail_win_profit_usd: 10.00
  min_tail_payoff_multiple: 20.00

# ── Pair / Merge Recycling ─────────────────────────────────────
# Batch tiny completed pairs by default; runtime bypasses this threshold and
# merges immediately when free cash is low or gross/market inventory is high.
pair:
  # Batch noisy tiny pairs by default, but keep immediate-recycle as a safety valve.
  min_merge_notional_usd: 12.00
  # Immediate merge when free cash is scarce or gross exposure is high.
  merge_pressure_free_cash_ratio: 0.15
  merge_pressure_gross_exposure_ratio: 0.50
  # Market-level imbalance pressure threshold before forcing immediate merge.
  # Set to 1.0 here to require clear one-way inventory before bypassing batching.
  merge_market_exposure_pressure_usd: 1.0

# ── Rescue / Merge Logic ────────────────────────────────────────
rescue:
  hedge_rescue_clip_usd: 1.00
  hedge_rescue_max_qty: 10.0
  hedge_rescue_edge_bps: 25
  hedge_rescue_race_buffer_ticks: 3.0
  sell_unwind_enabled: false
  merge_gas_cost_usd: 0.30

# ── Signal & Momentum Tilt ──────────────────────────────────────
signals:
  momentum_tilt_per_bps: 0.0001
  momentum_max_tilt: 0.02
  order_flow_imbalance_threshold: 0.0
  asymmetric_fill_max_penalty: 0.02
  reversal:
    enabled: true
    deceleration_weight: 0.35
    momentum_flip_weight: 0.25
    distance_weight: 0.20
    orderflow_weight: 0.20
    strong_momentum_bps: 8.0
    flip_deadband_bps: 1.0
  book_sanity:
    max_spread: 0.08
    min_top_depth_notional_usd: 3.0
    max_staleness_ms: 1500
    max_queue_depth_usd: 200.0
    max_projected_pair_cost: 0.995
  side_score:
    fair_value_weight: 0.35
    momentum_weight: 0.25
    orderflow_weight: 0.20
    terminal_timing_weight: 0.15
    reversal_risk_weight: 0.15
    book_sanity_weight: 0.10
    max_ladder_tilt: 0.35
    max_late_convex_tilt: 0.80
    min_favorite_confidence: 0.05

# ── Time / Bar Phase Scaling ────────────────────────────────────
bar_phase:
  early_clip_scale: 1.0
  mid_clip_scale: 0.6
  late_clip_scale: 1.4
  final_clip_scale: 0.0

# ── Vol Regime & EV Controls ────────────────────────────────────
vol_regime:
  high_vol_spread_multiplier: 2.0
  high_vol_size_reduction: 0.5

ev:
  hold_vs_rescue_buffer_bps: 15   # extra edge required to hold instead of rescue

# ── Operational ─────────────────────────────────────────────────
operational:
  cooldown_ms: 1000
  max_entry_free_cash_bps: 6000
  max_rescue_free_cash_bps: 5000
  taker_fee_coeff: 0.072
  recycle_min_imbalance_qty: 5.0
  recycle_min_time_remaining_ms: 90000
  recycle_max_light_side_spread: 0.10

# ── Tiny-Live / Deployment Scaling ──────────────────────────────
scaling:
  capital_scale_factor: 1.0       # $1k live sleeve; caps above remain the hard limit

version: "1.1"
last_updated: "2026-05-04"
description: "Paired two-sided BTC 5m market-making profile with labelled merge/recycle decisions and small late-window convex overlay"
