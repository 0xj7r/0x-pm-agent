description: |
  Bonereaper-scale tuning of late_favorite_directional. Per v3 late-
  phase analysis: bonereaper concentrates 17.7% of his $8.46M notional
  in the last 30s of each bar, with 94% of late dollars on the
  favourite. Implied late clip sizes: dog $1.52, fav $124.22.
  This profile bumps clip caps to match.

late_favorite:
  favorite_climb:
    enabled: true
    min_favorite_ask: 0.85
    max_favorite_ask: 0.99
    # Bonereaper backloads heavier in last ~30s; tighter window.
    window_sec: 60
    clip_usd: 100.0
    max_load_usd: 800.0
    maker_improve_ticks: 0.0
    min_order_usd: 1.0
  convex_tail:
    enabled: true
    max_cheap_ask: 0.15
    window_sec: 30
    clip_usd: 1.50
    # Lower dog-count ratio (75% vs unlawful's 154%) so cap can be lower
    # relative to favorite, but absolute is higher because everything is
    # bigger.
    max_load_usd: 80.0
    maker_improve_ticks: 0.0
    min_order_usd: 0.5
