  center_price: 0.50
  clip_shares: 1.0
  max_unpaired_core_qty: 5.0
  ladder_min_price: 0.20
  ladder_max_price: 0.70
  maker_improve_ticks: 0.0
  merge_min_qty: 5.0
  merge_batch_cap: 100.0

late_favorite:
