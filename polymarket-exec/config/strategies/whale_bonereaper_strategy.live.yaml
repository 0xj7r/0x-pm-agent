strategy: bonereaper_mm
profile_name: whale_bonereaper_strategy
version: "1.0"
last_updated: 2026-05-11
description: |
  Bonereaper strategy as one profile with explicit paired MM core and late-favorite
  directional overlay: paired-core is handled by paired_core, directional timing by
  late_favorite. The favorite load is reactive to BTC spot direction throughout
  the eligible bar, with an opening-noise guard, smaller sub-90c overlays, and
  size increasing toward expiry.

  Important: this profile is capital-scaled for tinylive. It preserves the
  Bonereaper shape, but reduces per-level shares and late-favorite clips so
  generated orders fit the live wallet's per-order and per-market risk caps.
  Late-favorite clips are heuristic shape+hard-cap driven (anti-Kelly), scale
  with bar progress, and are capped by max_load_usd.
  The whale behavior is consistent with hard shape controls plus hard per-market clips,
  not per-bet Kelly optimization.

quote:
  levels_per_side: 17

inventory:
  max_open_orders_total: 80
  max_open_orders_per_market: 10
  max_order_notional_usd: 7.0
  max_net_notional_per_market_usd: 70.0

health:
  market_ws_stale_ms: 15000

risk:
  book_stale_ms: 5000

pair:
  min_merge_notional_usd: 5.0
  merge_market_exposure_pressure_usd: 20.0

paired_core:
  enabled: true
  ladder_levels: 5
  ladder_span: 0.20
  center_price: 0.50
  clip_shares: 1.0
  max_unpaired_core_qty: 5.0
  ladder_min_price: 0.20
  ladder_max_price: 0.70
  maker_improve_ticks: 0.0
  merge_min_qty: 5.0
  merge_batch_cap: 100.0

late_favorite:
  favorite_climb:
    enabled: true
    min_favorite_ask: 0.70
    max_favorite_ask: 0.99
    window_sec: 300
    start_frac: 0.10
    min_elapsed_sec: 75
    clip_usd: 7.0
    max_load_usd: 35.0
    maker_improve_ticks: 0.0
    # Keep accepted late-favorite signals economically meaningful. Smaller
    # computed clips were collapsing to venue-min 5-share dribbles, which
    # under-expresses the Bonereaper lane while still taking reversal risk.
    min_order_usd: 4.0
    spot_filter_bps: 10.0
    require_spot_match: true
    # These remain defensive, but not so punitive that valid favourite signals
    # only place nominal size. Reversal protection is handled by cheap-tail /
    # future reversal-hedge accounting, not by suppressing the main lane to zero.
    regime_whipsaw_multiplier: 0.45
    regime_flat_multiplier: 0.75
    regime_trending_volatile_multiplier: 0.75
    regime_unknown_multiplier: 0.80
    reversal_multiplier: 0.70
    taker_min_favorite_ask: 0.90
    taker_window_sec: 120
  convex_tail:
    enabled: true
    # Pure convexity hedge only. 20c-35c belongs to pairable core/reversal
    # inventory, not cheap-tail insurance, because payoff multiple is too low
    # to hedge late-favorite reversals without eroding too much edge.
    max_cheap_ask: 0.20
    window_sec: 60
    start_frac: 0.0
    clip_usd: 2.0
    max_load_usd: 8.0
    max_favorite_exposure_fraction: 0.35
    max_win_edge_spend_fraction: 0.65
    maker_improve_ticks: 0.0
    min_order_usd: 0.5
  reversal_hedge:
    enabled: true
    # Separate from pure cheap-tail insurance. This lane only buys the
    # opposite leg when filled late-favorite exposure exists and the live
    # tape shows reversal/whipsaw risk. It shares the same hedge inventory
    # accounting as cheap-tail so both lanes cannot over-hedge the favorite.
    min_hedge_ask: 0.20
    max_hedge_ask: 0.45
    window_sec: 120
    start_frac: 0.0
    clip_usd: 2.0
    max_load_usd: 8.0
    max_favorite_exposure_fraction: 0.30
    max_win_edge_spend_fraction: 0.65
    maker_improve_ticks: 0.0
    min_order_usd: 1.0
    min_reversal_score: 0.45
    whipsaw_score_bonus: 0.25
    flat_score_bonus: 0.15
    trending_volatile_score_bonus: 0.10
    directional_smooth_score_penalty: 0.20
