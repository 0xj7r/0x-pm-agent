  late_favorite.

  Important: late-favorite clips are heuristic shape+hard-cap driven (anti-Kelly in
  the late window). They scale up as favorite price rises and are capped by max_load_usd.
  The whale behavior is consistent with hard shape controls plus hard per-market clips,
  not per-bet Kelly optimization.

