strategy: bonereaper_mm
profile_name: whale_bonereaper_strategy
version: "1.0"
last_updated: 2026-05-11
description: |
  Bonereaper strategy as one profile with explicit paired MM core and late-favorite
  directional overlay: paired-core is handled by paired_core, directional timing by
  late_favorite. The favorite load is reactive to BTC spot direction throughout
  the eligible bar, with an opening-noise guard, smaller sub-90c overlays, and
  size increasing toward expiry.

  Important: this profile is capital-scaled for the 3K live wallet. It preserves
  the Bonereaper shape, but keeps per-level shares at the venue minimum and
  broadens the ladder through more levels, wider spacing, and larger per-market
  headroom rather than by making any one ticket large.
  Late-favorite clips are heuristic shape+hard-cap driven (anti-Kelly), scale
  with bar progress, and are capped by max_load_usd.
  The whale behavior is consistent with hard shape controls plus hard per-market clips,
  not per-bet Kelly optimization.

quote:
  levels_per_side: 17

inventory:
  max_open_orders_total: 120
  max_open_orders_per_market: 48
  max_order_notional_usd: 250.0
  max_gross_notional_usd: 1200.0
  max_net_notional_per_market_usd: 900.0
  max_position_quantity_per_instrument: 1500.0
  min_free_cash_usd: 25.0
  min_free_cash_bps: 500.0
  max_session_loss_bps: 2500.0

health:
  market_ws_stale_ms: 15000

risk:
  book_stale_ms: 5000

pair:
  merge_enabled: false
  pressure_merge_enabled: false
  min_merge_notional_usd: 15.0
  merge_pressure_free_cash_ratio: 0.0
  merge_pressure_gross_exposure_ratio: 999999.0
  merge_market_exposure_pressure_usd: 999999.0

paired_core:
  # Temporarily disabled for live: recent evidence showed paired-core maker
  # fills becoming accidental one-sided mid-price exposure. Keep live focused
  # on explicit late-favorite and cheap-tail lanes until paired-core has a
  # stricter bundle-first design.
  enabled: false
  # Broad mergeable maker ladder. This is intentionally not a strict
  # pre-paired package: fills become mergeable inventory and can later recycle
  # with any opposite-side mergeable fill if realised pair cost is positive.
  ladder_levels: 17
  ladder_span: 0.60
  center_price: 0.50
  # Polymarket BTC 5m venue minimum is 5 shares. Sub-5 clips are coerced to
  # 5 by runtime sizing, so keep the profile explicit and broaden via levels.
  clip_shares: 5.0
  # Keep fresh paired-core from becoming a real directional position. One
  # venue-min clip can be stranded while the mate fills; beyond that, only
  # repair/pair-completion should add exposure.
  max_unpaired_core_qty: 5.0
  ladder_min_price: 0.20
  ladder_max_price: 0.70
  # Stop fresh paired-core in the late window. After 180s elapsed, the bar
  # should allocate new risk to explicit late-favorite and cheap-tail/reversal
  # lanes; any existing paired-core inventory can still merge or redeem.
  disable_after_elapsed_ms: 180000
  # Improve only near-touch ladder rungs by one tick. The strategy code still
  # keeps orders post-only and suppresses broad paired-core outside eligible
  # flat/center regimes; this improves queue/fill probability without pulling
  # the whole ladder to touch.
  maker_improve_ticks: 1.0
  merge_min_qty: 15.0
  merge_batch_cap: 100.0

late_favorite:
  favorite_climb:
    enabled: true
    min_favorite_ask: 0.70
    max_favorite_ask: 0.99
    clip_usd: 45.0
    max_load_usd: 450.0
    # Keep accepted late-favorite signals economically meaningful. Smaller
    # computed clips were collapsing to venue-min 5-share dribbles, which
    # under-expresses the Bonereaper lane while still taking reversal risk.
    min_order_usd: 10.0
  convex_tail:
    enabled: true
    clip_usd: 3.0
    max_load_usd: 30.0
    min_order_usd: 1.0
  reversal_hedge:
    enabled: false
