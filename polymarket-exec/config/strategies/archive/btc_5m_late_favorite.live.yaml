strategy: late_favorite_directional
profile_name: btc_5m_late_favorite
version: "0.2"
description: |
  Late-favorite directional loader with BTC-direction confirmation.
  Default profile keeps a small directional leg and convex tail.

late_favorite:
  favorite_climb:
    enabled: true
    min_favorite_ask: 0.90
    max_favorite_ask: 0.99
    window_sec: 120
    start_frac: 0.0
    clip_usd: 20.0
    max_load_usd: 200.0
    maker_improve_ticks: 0.0
    min_order_usd: 1.0
    spot_filter_bps: 10.0
    require_spot_match: true
  convex_tail:
    enabled: true
    max_cheap_ask: 0.02
    window_sec: 60
    start_frac: 0.0
    clip_usd: 2.0
    max_load_usd: 15.0
    maker_improve_ticks: 0.0
    min_order_usd: 0.5
