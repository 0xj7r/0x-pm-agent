strategy: late_favorite_directional
profile_name: btc_5m_late_favorite
version: "0.1"
last_updated: 2026-05-10
description: |
  Bonereaper-style late-favorite directional with convex tail hedge.
  Phase A: load expensive leg as it climbs 0.85 -> 0.99 in last few min.
  Phase B: massive convex tail buy on cheap leg compressed to <= 0.02 in
  final ~30s. Source: live evidence 2026-05-10 + per-market dollar-skew
  analysis (bonereaper -0.33 median notional skew). Note bonereaper is
  net loss-making over short windows; this profile exists for
  comparative perf analysis vs paired_mm and core_hedge_mm.

late_favorite:
  # Calibrated to v3 late-phase analysis (2026-05-10):
  # unlawful late: dog clip $0.69, fav clip $16.43, 154% dog/fav count ratio
  # bonereaper late: dog clip $1.52, fav clip $124.22, 75% dog/fav count ratio
  # Profile here is unlawful-tuned. bonereaper variant in a separate YAML.
  favorite_climb:
    enabled: true
    min_favorite_ask: 0.85
    max_favorite_ask: 0.99
    window_sec: 180
    clip_usd: 16.0
    max_load_usd: 200.0
    maker_improve_ticks: 0.0
    min_order_usd: 1.0
  convex_tail:
    enabled: true
    # Whales bid the cheap dog up to 0.15 throughout late phase, not just
    # the compressed 0.01-0.02 tier. Wider band captures the full ladder.
    max_cheap_ask: 0.15
    window_sec: 60
    # Per-clip $0.69-$1.52 in the data. Set near the lower bound.
    clip_usd: 0.75
    # Many small bids = high cumulative load. Whale ratio 154% dog/fav by
    # count means more dollars on the dog over the bar than the cap below
    # used to allow.
    max_load_usd: 50.0
    maker_improve_ticks: 0.0
    min_order_usd: 0.5
