x-agent-service: &agent-service
  build:
    context: .
  image: polymarket-agent:latest
  restart: always
  env_file:
    - .env
  environment:
    LOG_LEVEL: INFO
    STRATEGY_CONFIG: /app/strategy_config.json
    BTC_DB_PATH: /data/btc_trades.db
  volumes:
    - ./data:/data
  command: ["--coin", "btc"]

services:
  btc-sniper:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-btc-sniper
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/btc_trades.db

  eth-sniper:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-sniper
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/eth_trades.db
    command: ["--coin", "eth"]

  btc-sniper-relaxed:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-btc-relaxed
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: relaxed
      BTC_DB_PATH: /data/btc_relaxed_trades.db
    command: ["--coin", "btc"]

  eth-sniper-relaxed:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-relaxed
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: relaxed
      BTC_DB_PATH: /data/eth_relaxed_trades.db
    command: ["--coin", "eth"]

  btc-low-thresh:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-btc-low-thresh
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: low_thresh
      BTC_DB_PATH: /data/btc_low_thresh_trades.db
    command: ["--coin", "btc"]

  eth-low-thresh:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-low-thresh
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: low_thresh
      BTC_DB_PATH: /data/eth_low_thresh_trades.db
    command: ["--coin", "eth"]

  btc-research-t10:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-btc-research-t10
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_t10
      BTC_DB_PATH: /data/btc_research_t10_trades.db
    command: ["--coin", "btc"]

  eth-research-t15:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-research-t15
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_t15_eth
      BTC_DB_PATH: /data/eth_research_t15_trades.db
    command: ["--coin", "eth"]

  btc-15m:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-btc-15m
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_15m_btc
      BTC_DB_PATH: /data/btc_15m_trades.db
    command: ["--coin", "btc", "--market-type", "15m"]

  eth-15m:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-15m
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_15m_eth
      BTC_DB_PATH: /data/eth_15m_trades.db
    command: ["--coin", "eth", "--market-type", "15m"]

  doge-research-t10:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-doge-research-t10
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_t10_doge
      BTC_DB_PATH: /data/doge_research_t10_trades.db
    command: ["--coin", "doge"]

  eth-realmoney:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-eth-realmoney
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: realmoney
      BTC_DB_PATH: /data/eth_realmoney_trades.db
    command: ["--coin", "eth"]

  btc-live-polymtrade-test:
    <<: *agent-service
    profiles: ["live-test"]
    container_name: polymarket-btc-live-polymtrade-test
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_t10_live
      BTC_DB_PATH: /data/btc_live_polymtrade_trades.db
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_POLYMTRADE_PRIVATE_KEY}
      POLYMARKET_SIGNATURE_TYPE: "1"
      POLYMARKET_FUNDER: "0xa57189d5b2285A5E64083d3925687bDFCE01fC83"
      ALLOW_LIVE_WITHOUT_SUPABASE: "1"
    command: ["--coin", "btc", "--live"]

  btc-live-t10:
    <<: *agent-service
    profiles: ["live"]
    container_name: polymarket-btc-live-t10
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: research_t10_live
      BTC_DB_PATH: /data/btc_live_t10_trades.db
    command: ["--coin", "btc", "--live"]

  sol-sniper:
    <<: *agent-service
    profiles: ["trading"]
    container_name: polymarket-sol-sniper
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/sol_trades.db
    command: ["--coin", "sol"]

  snapshot-collector:
    <<: *agent-service
    container_name: polymarket-snapshot-collector
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
    volumes:
      - ./data:/data
      - ./data/snapshots:/app/backtesting
    entrypoint: ["python", "collector/snapshot_recorder.py"]
    command: ["--coin", "btc", "--coin", "eth", "--coin", "sol", "--interval", "1.0"]

