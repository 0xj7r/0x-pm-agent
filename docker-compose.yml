x-agent-service: &agent-service
  build:
    context: .
  image: polymarket-agent:latest
  restart: always
  env_file:
    - .env
  environment:
    LOG_LEVEL: INFO
    STRATEGY_CONFIG: /app/strategy_config.json
    BTC_DB_PATH: /data/btc_trades.db
  volumes:
    - ./data:/data
  command: ["--coin", "btc"]

services:
  btc-sniper:
    <<: *agent-service
    container_name: polymarket-btc-sniper
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/btc_trades.db

  eth-sniper:
    <<: *agent-service
    container_name: polymarket-eth-sniper
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/eth_trades.db
    command: ["--coin", "eth"]

  btc-sniper-relaxed:
    <<: *agent-service
    container_name: polymarket-btc-relaxed
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: relaxed
      BTC_DB_PATH: /data/btc_relaxed_trades.db
    command: ["--coin", "btc"]

  eth-sniper-relaxed:
    <<: *agent-service
    container_name: polymarket-eth-relaxed
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: relaxed
      BTC_DB_PATH: /data/eth_relaxed_trades.db
    command: ["--coin", "eth"]

  btc-low-thresh:
    <<: *agent-service
    container_name: polymarket-btc-low-thresh
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: low_thresh
      BTC_DB_PATH: /data/btc_low_thresh_trades.db
    command: ["--coin", "btc"]

  eth-low-thresh:
    <<: *agent-service
    container_name: polymarket-eth-low-thresh
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: low_thresh
      BTC_DB_PATH: /data/eth_low_thresh_trades.db
    command: ["--coin", "eth"]

  eth-realmoney:
    <<: *agent-service
    container_name: polymarket-eth-realmoney
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: realmoney
      BTC_DB_PATH: /data/eth_realmoney_trades.db
    command: ["--coin", "eth"]

  sol-sniper:
    <<: *agent-service
    container_name: polymarket-sol-sniper
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
      STRATEGY_PROFILE: default
      BTC_DB_PATH: /data/sol_trades.db
    command: ["--coin", "sol"]

  snapshot-collector:
    <<: *agent-service
    container_name: polymarket-snapshot-collector
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
    volumes:
      - ./data:/data
      - ./data/snapshots:/app/backtesting
    entrypoint: ["python", "collector/snapshot_recorder.py"]
    command: ["--coin", "btc", "--coin", "eth", "--coin", "sol", "--interval", "1.0"]

  autoresearch:
    <<: *agent-service
    container_name: polymarket-autoresearch
    environment:
      LOG_LEVEL: INFO
      STRATEGY_CONFIG: /app/strategy_config.json
    volumes:
      - ./data:/data
      - ./data/snapshots:/data/snapshots
    entrypoint: ["python", "autoresearch/runner.py"]
    command: ["--loop", "--interval", "604800", "--db-dir", "/data/snapshots"]
