[workspace]
members = ["polymarket-exec"]
resolver = "2"

# Path dependencies on the validated BTC-5m fade strategy crates in the sibling
# polymarket-backtest workspace. shadow_live runs the EXACT pm-shadow engine
# (decide_entry + feeds) that backtest/shadow-final validated. Edit SSOT in
# polymarket-backtest; agent consumes via these path deps.
[workspace.dependencies]
pm-types    = { path = "../polymarket-backtest/crates/pm-types" }
