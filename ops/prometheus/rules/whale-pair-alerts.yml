groups:
  - name: whale-pair
    rules:
      - alert: WhalePairServiceDown
        expr: whale_pair_service_up{service=~"whale-pair-live|whale-pair-shadow"} == 0
        for: 2m
        labels:
          severity: critical
          team: whale-pair
        annotations:
          summary: "Whale-pair service down"
          description: "{{ $labels.service }} is not running on the host."

      - alert: WhalePairNoRecentLogs
        expr: whale_pair_service_up{service=~"whale-pair-live|whale-pair-shadow"} == 1 and whale_pair_service_recent_log_lines{service=~"whale-pair-live|whale-pair-shadow"} < 1
        for: 5m
        labels:
          severity: warning
          team: whale-pair
        annotations:
          summary: "Whale-pair service has gone quiet"
          description: "{{ $labels.service }} has emitted no logs in the recent collection window."

      - alert: WhalePairBookAgeStale
        expr: whale_pair_service_up{service=~"whale-pair-live|whale-pair-shadow"} == 1 and whale_pair_service_has_book_telemetry{service=~"whale-pair-live|whale-pair-shadow"} == 1 and whale_pair_service_book_age_avg_ms{service=~"whale-pair-live|whale-pair-shadow"} > 2000
        for: 3m
        labels:
          severity: warning
          team: whale-pair
        annotations:
          summary: "Whale-pair book telemetry is stale"
          description: "{{ $labels.service }} average recent book_age_ms exceeded 2000ms."

      - alert: WhalePairLedgerStale
        expr: whale_pair_service_up{service=~"whale-pair-live|whale-pair-shadow"} == 1 and whale_pair_service_ledger_present{service=~"whale-pair-live|whale-pair-shadow"} == 1 and whale_pair_service_ledger_age_seconds{service=~"whale-pair-live|whale-pair-shadow"} > 600
        for: 10m
        labels:
          severity: warning
          team: whale-pair
        annotations:
          summary: "Whale-pair ledger looks stale"
          description: "{{ $labels.service }} ledger has not been updated in more than 10 minutes."

      - alert: WhalePairMonitoringCollectionFailed
        expr: whale_pair_service_metrics_collection_success{service=~"whale-pair-live|whale-pair-shadow"} == 0
        for: 2m
        labels:
          severity: warning
          team: whale-pair
        annotations:
          summary: "Whale-pair metrics bridge failed"
          description: "{{ $labels.service }} metrics collection did not complete successfully."

      - alert: WhalePairNodeExporterMissing
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          team: whale-pair
        annotations:
          summary: "node-exporter target missing"
          description: "Prometheus cannot scrape node-exporter."

      - alert: WhalePairCadvisorMissing
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
          team: whale-pair
        annotations:
          summary: "cAdvisor target missing"
          description: "Prometheus cannot scrape cAdvisor."
