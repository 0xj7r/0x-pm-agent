<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Sniper</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --bg-primary: #0a0e17;
  --bg-card: #111827;
  --bg-card-hover: #1a2332;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #64748b;
  --text-muted: #475569;
  --green: #10b981;
  --green-dim: rgba(16, 185, 129, 0.15);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.15);
  --blue: #3b82f6;
  --amber: #f59e0b;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #0f1520 0%, var(--bg-primary) 100%);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 1.1em;
  letter-spacing: -0.02em;
}

.logo span { color: var(--green); }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.7em;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.status-pill.live {
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.status-pill.offline {
  background: var(--red-dim);
  color: var(--red);
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 0.75em;
  color: var(--text-secondary);
}

.refresh-timer { font-variant-numeric: tabular-nums; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}

.metric-card {
  background: var(--bg-card);
  padding: 20px 24px;
  transition: background 0.2s;
}

.metric-card:hover { background: var(--bg-card-hover); }

.metric-label {
  font-size: 0.65em;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.metric-value {
  font-size: 1.6em;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.metric-value.positive { color: var(--green); }
.metric-value.negative { color: var(--red); }

.metric-sub {
  font-size: 0.7em;
  color: var(--text-secondary);
  margin-top: 4px;
}

.main {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 1px;
  background: var(--border);
  min-height: calc(100vh - 200px);
}

.chart-panel {
  background: var(--bg-primary);
  padding: 20px 24px;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.chart-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.chart-container {
  position: relative;
  height: 280px;
}

.side-panel {
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
}

.panel-section {
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
}

.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7em;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}

.coin-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(30, 41, 59, 0.5);
}

.coin-row:last-child { border-bottom: none; }

.coin-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  font-size: 0.85em;
}

.coin-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.coin-dot.btc { background: var(--amber); }
.coin-dot.eth { background: var(--purple); }
.coin-dot.sol { background: var(--cyan); }

.coin-stats {
  text-align: right;
  font-size: 0.75em;
}

.coin-wr { color: var(--text-primary); font-weight: 600; }
.coin-trades { color: var(--text-secondary); }

.trade-list {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.trade-item {
  display: grid;
  grid-template-columns: 60px 1fr 70px;
  gap: 8px;
  align-items: center;
  padding: 10px 20px;
  border-bottom: 1px solid rgba(30, 41, 59, 0.3);
  font-size: 0.75em;
  transition: background 0.15s;
}

.trade-item:hover { background: var(--bg-card-hover); }

.trade-time {
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.trade-market {
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.trade-pnl {
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.trade-pnl.win { color: var(--green); }
.trade-pnl.loss { color: var(--red); }
.trade-pnl.pending { color: var(--text-muted); }

.signal-bar {
  display: flex;
  gap: 2px;
  align-items: flex-end;
  height: 40px;
  margin-top: 8px;
}

.signal-tick {
  flex: 1;
  min-width: 3px;
  background: var(--border);
  border-radius: 1px 1px 0 0;
  transition: height 0.3s, background 0.3s;
}

.signal-tick.active { background: var(--green); }
.signal-tick.miss { background: var(--red); opacity: 0.6; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 0.8em;
  text-align: center;
  gap: 8px;
}

.empty-icon { font-size: 2em; opacity: 0.3; }

@media (max-width: 1024px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">POLY<span>SNIPER</span></div>
    <div class="status-pill live" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">PAPER</span>
    </div>
  </div>
  <div class="header-right">
    <span id="coin-label">BTC + ETH</span>
    <span class="refresh-timer" id="refresh-timer">15s</span>
    <span id="uptime"></span>
  </div>
</div>

<div class="grid">
  <div class="metric-card">
    <div class="metric-label">Balance</div>
    <div class="metric-value" id="balance">$100.00</div>
    <div class="metric-sub" id="balance-change">+0.00%</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Total P&L</div>
    <div class="metric-value" id="pnl">$0.00</div>
    <div class="metric-sub" id="pnl-trades">0 trades</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Win Rate</div>
    <div class="metric-value" id="winrate">0%</div>
    <div class="metric-sub" id="winrate-detail">0W / 0L</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Avg Profit / Trade</div>
    <div class="metric-value" id="avg-pnl">$0.00</div>
    <div class="metric-sub" id="max-dd">Max DD: 0%</div>
  </div>
</div>

<div class="main">
  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-title">Equity Curve</div>
    </div>
    <div class="chart-container">
      <canvas id="equityChart"></canvas>
    </div>

    <div style="margin-top: 24px;">
      <div class="chart-header">
        <div class="chart-title">Signal Activity (last 24h)</div>
      </div>
      <div class="signal-bar" id="signal-bar"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-section">
      <div class="panel-title">Per-Coin Performance</div>
      <div id="coin-breakdown">
        <div class="coin-row">
          <div class="coin-name"><div class="coin-dot btc"></div>BTC</div>
          <div class="coin-stats">
            <div class="coin-wr">--</div>
            <div class="coin-trades">0 trades</div>
          </div>
        </div>
        <div class="coin-row">
          <div class="coin-name"><div class="coin-dot eth"></div>ETH</div>
          <div class="coin-stats">
            <div class="coin-wr">--</div>
            <div class="coin-trades">0 trades</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-section" style="flex: 0;">
      <div class="panel-title">Recent Trades</div>
    </div>
    <div class="trade-list" id="trade-list">
      <div class="empty-state">
        <div class="empty-icon">&#9678;</div>
        <div>Waiting for first trade...</div>
        <div>Bot is scanning for signals</div>
      </div>
    </div>
  </div>
</div>

<script>
const REFRESH_MS = 15000;
let refreshCountdown = 15;
let equityChart = null;

function fmt(n, decimals = 2) {
  if (n == null) return '--';
  const sign = n >= 0 ? '+' : '';
  return sign + '$' + Math.abs(n).toFixed(decimals);
}

function fmtPct(n) {
  if (n == null) return '--';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return Math.floor(diff) + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function shortTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function initChart() {
  const ctx = document.getElementById('equityChart').getContext('2d');
  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: '#10b981',
        backgroundColor: 'rgba(16, 185, 129, 0.05)',
        fill: true,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          borderColor: '#334155',
          borderWidth: 1,
          titleFont: { family: 'JetBrains Mono', size: 11 },
          bodyFont: { family: 'JetBrains Mono', size: 11 },
          callbacks: {
            label: ctx => '$' + ctx.parsed.y.toFixed(2)
          }
        }
      },
      scales: {
        x: {
          display: true,
          ticks: { color: '#475569', font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 8 },
          grid: { color: 'rgba(30, 41, 59, 0.5)' },
        },
        y: {
          display: true,
          ticks: {
            color: '#475569',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: v => '$' + v.toFixed(0)
          },
          grid: { color: 'rgba(30, 41, 59, 0.5)' },
        }
      }
    }
  });
}

function updateDashboard(data) {
  const s = data.status || {};
  const trades = data.trades || [];
  const balHistory = data.balance_history || [];

  // Status
  const pill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  if (s.container === 'running') {
    pill.className = 'status-pill live';
    statusText.textContent = s.paper !== false ? 'PAPER' : 'LIVE';
  } else {
    pill.className = 'status-pill offline';
    statusText.textContent = 'OFFLINE';
  }

  if (s.uptime_seconds) {
    const h = Math.floor(s.uptime_seconds / 3600);
    const m = Math.floor((s.uptime_seconds % 3600) / 60);
    document.getElementById('uptime').textContent = 'Up ' + h + 'h ' + m + 'm';
  }

  // Metrics
  const balance = s.balance || 0;
  const startBal = s.starting_balance || 100;
  const pnl = s.total_pnl || 0;
  const wins = s.wins || 0;
  const losses = s.losses || 0;
  const total = wins + losses;
  const wr = total > 0 ? (wins / total * 100) : 0;
  const avgPnl = total > 0 ? pnl / total : 0;

  document.getElementById('balance').textContent = '$' + balance.toFixed(2);
  const balChange = ((balance - startBal) / startBal * 100);
  const balChangeEl = document.getElementById('balance-change');
  balChangeEl.textContent = fmtPct(balChange) + ' from start';
  balChangeEl.style.color = balChange >= 0 ? 'var(--green)' : 'var(--red)';

  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = fmt(pnl);
  pnlEl.className = 'metric-value ' + (pnl >= 0 ? 'positive' : 'negative');
  document.getElementById('pnl-trades').textContent = total + ' resolved';

  document.getElementById('winrate').textContent = wr.toFixed(0) + '%';
  document.getElementById('winrate-detail').textContent = wins + 'W / ' + losses + 'L';

  const avgEl = document.getElementById('avg-pnl');
  avgEl.textContent = fmt(avgPnl);
  avgEl.className = 'metric-value ' + (avgPnl >= 0 ? 'positive' : 'negative');

  // Equity chart
  if (balHistory.length > 0) {
    const sorted = [...balHistory].reverse();
    equityChart.data.labels = sorted.map(s => shortTime(s.created_at));
    equityChart.data.datasets[0].data = sorted.map(s => s.balance_usd);
    const color = sorted[sorted.length-1].balance_usd >= startBal ? '#10b981' : '#ef4444';
    equityChart.data.datasets[0].borderColor = color;
    equityChart.data.datasets[0].backgroundColor = color.replace(')', ', 0.05)').replace('rgb', 'rgba');
    equityChart.update('none');
  } else if (trades.length > 0) {
    // Build equity from trades
    let bal = startBal;
    const points = [{ t: 'Start', b: bal }];
    const resolved = trades.filter(t => t.pnl_usd != null).reverse();
    resolved.forEach(t => {
      bal += t.pnl_usd;
      points.push({ t: shortTime(t.resolved_at || t.created_at), b: bal });
    });
    equityChart.data.labels = points.map(p => p.t);
    equityChart.data.datasets[0].data = points.map(p => p.b);
    const color = bal >= startBal ? '#10b981' : '#ef4444';
    equityChart.data.datasets[0].borderColor = color;
    equityChart.update('none');
  }

  // Trade list
  const tradeList = document.getElementById('trade-list');
  if (trades.length === 0) {
    tradeList.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9678;</div><div>Waiting for first trade...</div><div>Bot is scanning for signals</div></div>';
  } else {
    tradeList.innerHTML = trades.slice(0, 50).map(t => {
      const pnlClass = t.pnl_usd == null ? 'pending' : (t.pnl_usd >= 0 ? 'win' : 'loss');
      const pnlText = t.pnl_usd == null ? 'OPEN' : fmt(t.pnl_usd);
      const market = t.market_question || t.market_id || '?';
      return '<div class="trade-item">' +
        '<div class="trade-time">' + timeAgo(t.created_at) + '</div>' +
        '<div class="trade-market">' + market + '</div>' +
        '<div class="trade-pnl ' + pnlClass + '">' + pnlText + '</div>' +
        '</div>';
    }).join('');
  }

  // Signal activity bar
  const events = data.events || [];
  const signalBar = document.getElementById('signal-bar');
  const now = Date.now();
  const buckets = new Array(48).fill(0);  // 30-min buckets over 24h
  events.forEach(e => {
    if (e.event_type === 'ENTRY' || e.event_type === 'SIGNAL') {
      const age = (now - new Date(e.timestamp).getTime()) / 1000 / 1800;
      const bucket = Math.min(47, Math.floor(age));
      buckets[47 - bucket]++;
    }
  });
  const maxB = Math.max(...buckets, 1);
  signalBar.innerHTML = buckets.map(b => {
    const h = Math.max(2, (b / maxB) * 40);
    const cls = b > 0 ? 'active' : '';
    return '<div class="signal-tick ' + cls + '" style="height:' + h + 'px"></div>';
  }).join('');
}

async function fetchDashboard() {
  try {
    const resp = await fetch('/api/dashboard');
    const data = await resp.json();
    updateDashboard(data);
  } catch (e) {
    console.error('Dashboard fetch error:', e);
    document.getElementById('status-pill').className = 'status-pill offline';
    document.getElementById('status-text').textContent = 'ERROR';
  }
}

function startRefreshLoop() {
  const timerEl = document.getElementById('refresh-timer');
  setInterval(() => {
    refreshCountdown--;
    if (refreshCountdown <= 0) {
      refreshCountdown = 15;
      fetchDashboard();
    }
    timerEl.textContent = refreshCountdown + 's';
  }, 1000);
}

initChart();
fetchDashboard();
startRefreshLoop();
</script>
</body>
</html>
